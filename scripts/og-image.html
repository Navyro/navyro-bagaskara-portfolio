<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>OG image source — Navyro Bagaskara</title>
    <!--
      Source for public/og-image.png (1200x630). Not part of the app bundle.

      Regenerate with:  npm run build:og
      The script copies this file next to .ux-logs/og/portrait.png, opens it in
      agent-browser at exactly 1200x630 and screenshots it. The portrait comes from
      TENTANG SAYA/PAS FOTO PNG/PAS FOTO BG BIRU.png (blue background, cropped).

      Typography is loaded from Google Fonts so the image uses the same Manrope/Inter
      pairing as the site. Rendering needs network; without it the fallback differs.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        display: flex;
        align-items: center;
        background: #0e0e10;
        color: #f4f4f6;
        font-family: "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* Brand accent bloom, top-left, kept far below text contrast levels. */
      .glow {
        position: absolute;
        width: 760px;
        height: 760px;
        left: -220px;
        top: -380px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(31, 79, 255, 0.55) 0%, rgba(31, 79, 255, 0) 62%);
      }

      .glow-right {
        position: absolute;
        width: 620px;
        height: 620px;
        right: -240px;
        bottom: -320px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(56, 189, 248, 0.28) 0%, rgba(56, 189, 248, 0) 65%);
      }

      /* Hairline frame so the card reads as a deliberate surface, not a photo alone. */
      .frame {
        position: absolute;
        inset: 24px;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 16px;
      }

      .content {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 56px;
        padding: 0 88px;
        width: 100%;
      }

      .copy { max-width: 660px; }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-family: "Manrope", sans-serif;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #38bdf8;
      }

      .eyebrow::before {
        content: "";
        width: 28px;
        height: 2px;
        background: #38bdf8;
      }

      h1 {
        margin-top: 22px;
        font-family: "Manrope", sans-serif;
        font-size: 74px;
        font-weight: 800;
        line-height: 1.02;
        letter-spacing: -0.03em;
        color: #f4f4f6;
      }

      .rule {
        margin: 26px 0 22px;
        width: 88px;
        height: 4px;
        border-radius: 2px;
        background: #1f4fff;
      }

      p.tagline {
        font-size: 25px;
        font-weight: 400;
        line-height: 1.42;
        color: #a0a0ab;
        max-width: 600px;
      }

      .contact {
        margin-top: 34px;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 20px;
        font-weight: 500;
        color: #9c9ca6;
      }

      .contact .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #3f3f46;
      }

      .portrait {
        position: relative;
        flex: 0 0 auto;
        width: 300px;
        height: 396px;
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.8);
      }

      .portrait img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 4%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="glow-right"></div>
    <div class="frame"></div>

    <div class="content">
      <div class="copy">
        <span class="eyebrow">UI/UX Designer · Front-End</span>
        <h1>Navyro<br />Bagaskara</h1>
        <div class="rule"></div>
        <p class="tagline">
          Merancang produk digital dari riset pengguna sampai prototipe dan kode siap produksi.
        </p>
        <div class="contact">
          <span>navbagaskara@gmail.com</span>
          <span class="dot"></span>
          <span>linkedin.com/in/navyro-bagaskara</span>
        </div>
      </div>

      <div class="portrait">
        <img src="portrait.png" alt="Navyro Bagaskara" />
      </div>
    </div>
  </body>
</html>
