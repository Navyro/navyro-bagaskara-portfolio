<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NB icon source</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* 512x512 source for app/icon.png and app/apple-icon.png.
         Full-bleed accent square (no transparent corners): browsers round it themselves and a
         bleed square survives dark, light and pinned-tab rendering without a halo. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 512px; height: 512px; background: #1f4fff; overflow: hidden; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Manrope", system-ui, sans-serif;
      }
      .mark {
        font-weight: 800;
        font-size: 236px;
        line-height: 1;
        letter-spacing: -0.055em;
        color: #ffffff;
        /* Optical centring: the glyph pair leans left because "N" is wider than "B". */
        transform: translate(-6px, -10px);
      }

      /* Maskable variant (?maskable=1): launchers crop to a circle of 80% diameter, so the mark
         has to sit inside that circle. 150px keeps the half-diagonal far inside the 204px
         radius instead of touching the crop edge. */
      .maskable .mark {
        font-size: 150px;
        transform: translate(-4px, -6px);
      }
    </style>
    <script>
      if (new URLSearchParams(location.search).has("maskable")) {
        document.documentElement.classList.add("maskable");
      }
    </script>
  </head>
  <body>
    <span class="mark">NB</span>
  </body>
</html>
