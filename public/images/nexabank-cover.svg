<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="675" fill="#0A192F"/>
  <rect x="80" y="60" width="1040" height="555" rx="16" fill="#112240" stroke="#233554" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="120" y="100" width="960" height="50" rx="8" fill="#1D2D50"/>
  <circle cx="150" cy="125" r="8" fill="#FF5F56"/>
  <circle cx="175" cy="125" r="8" fill="#FFBD2E"/>
  <circle cx="200" cy="125" r="8" fill="#27C93F"/>
  <text x="240" y="130" fill="#8892B0" font-family="sans-serif" font-size="14" font-weight="600">NexaBank Mobile App — High Fidelity Prototype</text>
  
  <!-- App Mockup Screens -->
  <!-- Screen 1: Dashboard -->
  <g transform="translate(160, 180)">
    <rect width="260" height="390" rx="24" fill="#0F172A" stroke="#334155" stroke-width="4"/>
    <rect x="20" y="30" width="220" height="80" rx="12" fill="url(#cardGrad)"/>
    <text x="35" y="55" fill="#FFFFFF" font-family="sans-serif" font-size="12" opacity="0.8">Total Saldo Utama</text>
    <text x="35" y="85" fill="#FFFFFF" font-family="sans-serif" font-size="20" font-weight="700">Rp 124.500.000</text>
    
    <!-- Quick Actions -->
    <rect x="20" y="125" width="45" height="45" rx="10" fill="#1E293B"/>
    <text x="36" y="152" fill="#38BDF8" font-family="sans-serif" font-size="16">⇄</text>
    <rect x="78" y="125" width="45" height="45" rx="10" fill="#1E293B"/>
    <text x="95" y="152" fill="#38BDF8" font-family="sans-serif" font-size="16">+</text>
    <rect x="136" y="125" width="45" height="45" rx="10" fill="#1E293B"/>
    <text x="151" y="152" fill="#38BDF8" font-family="sans-serif" font-size="16">📄</text>
    <rect x="195" y="125" width="45" height="45" rx="10" fill="#1E293B"/>
    <text x="210" y="152" fill="#38BDF8" font-family="sans-serif" font-size="16">⋯</text>
    
    <!-- Transaction History List -->
    <rect x="20" y="185" width="220" height="40" rx="8" fill="#1E293B"/>
    <circle cx="40" cy="205" r="12" fill="#0284C7"/>
    <text x="60" y="202" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="600">Transfer PT Tech</text>
    <text x="60" y="215" fill="#94A3B8" font-family="sans-serif" font-size="9">11 Aug 2026</text>
    <text x="170" y="209" fill="#4ADE80" font-family="sans-serif" font-size="11" font-weight="700">+Rp 15M</text>
    
    <rect x="20" y="235" width="220" height="40" rx="8" fill="#1E293B"/>
    <circle cx="40" cy="255" r="12" fill="#E11D48"/>
    <text x="60" y="252" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="600">Merchant Payment</text>
    <text x="60" y="265" fill="#94A3B8" font-family="sans-serif" font-size="9">10 Aug 2026</text>
    <text x="175" y="259" fill="#F87171" font-family="sans-serif" font-size="11" font-weight="700">-Rp 450K</text>
  </g>

  <!-- Screen 2: Transfer Confirmation -->
  <g transform="translate(470, 180)">
    <rect width="260" height="390" rx="24" fill="#0F172A" stroke="#38BDF8" stroke-width="4"/>
    <text x="25" y="45" fill="#F8FAFC" font-family="sans-serif" font-size="16" font-weight="700">Konfirmasi Transfer</text>
    <rect x="25" y="65" width="210" height="60" rx="12" fill="#1E293B"/>
    <text x="40" y="90" fill="#94A3B8" font-family="sans-serif" font-size="11">Penerima</text>
    <text x="40" y="110" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="600">Navyro Bagaskara</text>
    <text x="160" y="110" fill="#38BDF8" font-family="sans-serif" font-size="11">BCA</text>
    
    <rect x="25" y="140" width="210" height="80" rx="12" fill="#1E293B"/>
    <text x="40" y="165" fill="#94A3B8" font-family="sans-serif" font-size="11">Nominal Transfer</text>
    <text x="40" y="198" fill="#38BDF8" font-family="sans-serif" font-size="22" font-weight="700">Rp 5.000.000</text>
    
    <rect x="25" y="320" width="210" height="44" rx="10" fill="#0284C7"/>
    <text x="80" y="347" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700">Konfirmasi & Kirim</text>
  </g>

  <!-- Screen 3: Success Screen -->
  <g transform="translate(780, 180)">
    <rect width="260" height="390" rx="24" fill="#0F172A" stroke="#334155" stroke-width="4"/>
    <circle cx="130" cy="100" r="30" fill="#22C55E" opacity="0.2"/>
    <circle cx="130" cy="100" r="20" fill="#22C55E"/>
    <path d="M123 100L128 105L137 94" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="130" y="150" fill="#F8FAFC" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">Transfer Berhasil!</text>
    <text x="130" y="170" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">11 Agustus 2026, 14:20 WIB</text>
    
    <rect x="25" y="195" width="210" height="110" rx="12" fill="#1E293B"/>
    <text x="40" y="225" fill="#94A3B8" font-family="sans-serif" font-size="11">Ref ID: NX-99201482</text>
    <text x="40" y="255" fill="#F8FAFC" font-family="sans-serif" font-size="18" font-weight="700">Rp 5.000.000</text>
  </g>
  
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="220" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0284C7"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>
</svg>
