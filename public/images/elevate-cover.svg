<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="675" fill="#18181B"/>
  <rect x="60" y="50" width="1080" height="575" rx="12" fill="#27272A" stroke="#3F3F46" stroke-width="2"/>
  
  <!-- Sidebar -->
  <rect x="90" y="80" width="220" height="515" rx="8" fill="#18181B"/>
  <text x="120" y="120" fill="#F4F4F5" font-family="sans-serif" font-size="16" font-weight="700">Elevate OS v2.0</text>
  <text x="120" y="150" fill="#A1A1AA" font-family="sans-serif" font-size="12" font-weight="600">DESIGN TOKENS</text>
  <rect x="110" y="165" width="180" height="30" rx="6" fill="#27272A"/>
  <text x="130" y="185" fill="#38BDF8" font-family="sans-serif" font-size="12">Colors &amp; Themes</text>
  <text x="130" y="215" fill="#71717A" font-family="sans-serif" font-size="12">Typography Scale</text>
  <text x="130" y="245" fill="#71717A" font-family="sans-serif" font-size="12">Spacing Scale</text>
  
  <text x="120" y="295" fill="#A1A1AA" font-family="sans-serif" font-size="12" font-weight="600">COMPONENTS</text>
  <text x="130" y="320" fill="#71717A" font-family="sans-serif" font-size="12">Buttons &amp; Actions</text>
  <text x="130" y="350" fill="#71717A" font-family="sans-serif" font-size="12">Input &amp; Forms</text>
  <text x="130" y="380" fill="#71717A" font-family="sans-serif" font-size="12">Data Table</text>
  
  <!-- Content Area -->
  <rect x="330" y="80" width="810" height="515" rx="8" fill="#18181B"/>
  <text x="370" y="130" fill="#F4F4F5" font-family="sans-serif" font-size="24" font-weight="700">Button Primitives &amp; States</text>
  
  <!-- Button Variants Showcase -->
  <!-- Primary Buttons -->
  <g transform="translate(370, 170)">
    <rect width="140" height="42" rx="8" fill="#1F4FFF"/>
    <text x="35" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="600">Primary CTA</text>
    
    <rect x="160" width="140" height="42" rx="8" fill="#163FCC"/>
    <text x="202" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="600">Hover State</text>
    
    <rect x="320" width="140" height="42" rx="8" fill="#1F4FFF" stroke="#60A5FA" stroke-width="3"/>
    <text x="362" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="600">Focus Ring</text>
    
    <rect x="480" width="140" height="42" rx="8" fill="#3F3F46"/>
    <text x="522" y="26" fill="#71717A" font-family="sans-serif" font-size="13" font-weight="600">Disabled</text>
  </g>

  <!-- Secondary Buttons -->
  <g transform="translate(370, 240)">
    <rect width="140" height="42" rx="8" fill="#27272A" stroke="#3F3F46" stroke-width="1"/>
    <text x="30" y="26" fill="#F4F4F5" font-family="sans-serif" font-size="13" font-weight="600">Secondary</text>
    
    <rect x="160" width="140" height="42" rx="8" fill="#3F3F46" stroke="#52525B" stroke-width="1"/>
    <text x="202" y="26" fill="#F4F4F5" font-family="sans-serif" font-size="13" font-weight="600">Hover State</text>
    
    <rect x="320" width="140" height="42" rx="8" fill="transparent" stroke="#1F4FFF" stroke-width="2"/>
    <text x="360" y="26" fill="#1F4FFF" font-family="sans-serif" font-size="13" font-weight="600">Outline</text>
  </g>

  <!-- Token Matrix Grid -->
  <g transform="translate(370, 320)">
    <rect width="730" height="240" rx="8" fill="#27272A" stroke="#3F3F46" stroke-width="1"/>
    <text x="20" y="35" fill="#A1A1AA" font-family="sans-serif" font-size="12" font-weight="600">TYPESCRIPT PROPS INTERFACE</text>
    
    <rect x="20" y="50" width="690" height="170" rx="6" fill="#18181B"/>
    <text x="40" y="80" fill="#38BDF8" font-family="sans-serif" font-size="13" font-family="monospace">interface ButtonProps extends React.ButtonHTMLAttributes&lt;HTMLButtonElement&gt; {</text>
    <text x="60" y="105" fill="#F4F4F5" font-family="sans-serif" font-size="13" font-family="monospace">variant?: 'primary' | 'secondary' | 'outline' | 'ghost';</text>
    <text x="60" y="130" fill="#F4F4F5" font-family="sans-serif" font-size="13" font-family="monospace">size?: 'sm' | 'md' | 'lg';</text>
    <text x="60" y="155" fill="#F4F4F5" font-family="sans-serif" font-size="13" font-family="monospace">isLoading?: boolean;</text>
    <text x="40" y="180" fill="#38BDF8" font-family="sans-serif" font-size="13" font-family="monospace">}</text>
  </g>
</svg>
